<header class="hero hero-landing">
  <!--
    SLIDESHOW — swap these placeholders for your real photos/videos.
    Each .hero-slide is one slide. For an image:
      <div class="hero-slide"><img src="assets/hero/photo-1.jpg" alt=""></div>
    For a video:
      <div class="hero-slide"><video src="assets/hero/clip-1.mp4" autoplay muted loop playsinline></video></div>
    js/script.js cycles them automatically — you don't need to touch the JS,
    just add or remove .hero-slide blocks.
  -->
  <div class="hero-slides" id="heroSlides">
    <div class="hero-slide is-active"><div class="ph"><span class="ph-label">Slide 1 — replace</span></div></div>
    <div class="hero-slide"><div class="ph"><span class="ph-label">Slide 2 — replace</span></div></div>
    <div class="hero-slide"><div class="ph"><span class="ph-label">Slide 3 — replace</span></div></div>
  </div>
  <div class="hero-scrim"></div>
  <div class="hero-content hero-content-center">
    <div class="logo-lockup">
      <img class="logo-mark-img" src="assets/brand/hoss-logo.png" alt="Hoss">
      <span class="logo-tagline">Architecture &amp; Design</span>
    </div>
  </div>
</header>
